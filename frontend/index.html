<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ask questions about 12,464 Bangalore restaurants in plain English. An AI agent writes the SQL and explains the answer."
    />
    <title>FoodieQuery</title>

    <!-- Inter for the interface, JetBrains Mono for SQL. One UI typeface and
         one monospace is what almost every real product ships with: the type
         should disappear so the data reads. preconnect opens the connection to
         Google's font servers early, which removes the flash of fallback text
         on first load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
